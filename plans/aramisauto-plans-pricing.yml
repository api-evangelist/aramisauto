note: >-
  Aramisauto publishes no API plans, tiers, quotas or list pricing of any kind,
  because it does not sell API access. It is a French online used- and 0km-car
  retailer: the prices on its site are vehicle prices, and the sitemap index
  (four child sitemaps — search, product, faq, silo) contains no developer,
  pricing-page or plans section at all. /pricing, /tarifs, /api, /developpeurs
  and /partenaires all return 404. The only commercial API-adjacent relationship
  is marketplace supply — a third-party seller whose inventory is ingested via
  the collect/map/filter/enrich configuration contracts at schemas.aramis.group —
  and that is a negotiated business arrangement with no published price, no
  self-serve signup and no rate card. This is an honest zero, recorded rather
  than omitted.

