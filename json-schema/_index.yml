note: >-
  Aramis Group publishes ten JSON Schema 2020-12 documents at
  https://schemas.aramis.group/ — a GitHub Pages site served from
  github.com/ARAMISAUTO/schemas.aramis.group (CNAME schemas.aramis.group) and
  titled "Aramis Group Schemas". Every file was fetched from the live host and
  saved verbatim; each declares
  "$schema": "https://json-schema.org/draft/2020-12/schema" and an absolute
  "$id" on schemas.aramis.group, so the documents identify themselves as
  Aramis Group's own. This is the ONLY machine-readable contract surface
  Aramisauto publishes — there is no OpenAPI, Swagger, GraphQL SDL or AsyncAPI
  anywhere on aramisauto.com, api.aramisauto.com or aramis.group (see
  x-coverage in apis.yml).

ownership:
  verdict: owned
  justification: >-
    The schemas live on aramis.group, not aramisauto.com. Aramis Group SA
    (Euronext Paris: ARAMI) is the listed parent that operates the Aramisauto
    brand in France, and the repository serving these files belongs to the
    GitHub organisation "Aramisauto.com" (github.com/ARAMISAUTO), whose profile
    blog is https://www.aramisauto.com. The schemas themselves are
    Aramisauto-specific rather than generic group plumbing: field names include
    aramisautoSupplierId, aramisautoPickupPointId, aramisautoSimpleColor,
    aramisautoCategory, aramisautoBodywork, aramisautoEnergyType,
    aramisautoPurchasingPriceWithoutTaxes and aramisautoSellingPriceWithTaxes.
  checks:
    schema_id_host: schemas.aramis.group
    repo: https://github.com/ARAMISAUTO/schemas.aramis.group
    repo_org_blog: https://www.aramisauto.com
    site_title: Aramis Group Schemas

