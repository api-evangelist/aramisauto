controlled_vocabularies:
  source: json-schema/aramisauto-catalog-base.schema.json
  shared_defs_referenced_by_offer:
  - offer-type-id
  - status-id
  - euronorm-string
  - critair-string
  - simple-color-id
  - simple-equipment-id
  - category-id
  - segment-id
  - energy-type-id
  - french-genre-string
  - transmission-id
  - drive-id
  - equipment-category-id
  note: >-
    Every taxonomy field on Offer is a $ref into base.schema.json rather than an
    inline enum, so one file governs the whole catalog vocabulary. Presented to
    clients as {id, label}.

value_object_units:
  note: >-
    Measurements are unit-named nullable objects, not bare numbers. Reproduced
    here because it is the modelling decision a consumer must understand first.
  power: '{ch, kw}'
  engineCapacity: '{cc}'
  consumption: '{ltPer100Km, kwhPer100Km}'
  co2Emissions: '{gramsPerKm}'
  dimensions: '{meters}'
  weights: '{kg}'
  bootSpace: '{lt}'
  maxSpeed: '{kmPerHour}'
  electricRange: '{km}'
  batteryCapacity: '{kwh}'
  chargePower: '{kw}'
  chargeTime: '{minutes}'
  batteryStateOfHealth: '{percent}'
  batteryWarrantyPeriod: '{km, years}'
  indicativeLoan: '{monthlyInstallment, months}'
  discount: '{percent}'

id_prefixes:
  published: false
  note: >-
    Aramisauto publishes no typed id prefixes. offerId and vehicleId are opaque
    strings; supplier and pickup-point ids are bare integers.

