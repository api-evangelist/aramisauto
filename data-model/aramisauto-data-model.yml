note: >-
  Derived entirely from the ten JSON Schema 2020-12 documents Aramis Group
  publishes at https://schemas.aramis.group/. There is no OpenAPI and no object
  reference page, so relationships were computed from `$ref` targets, from
  nested object/array members, and from id-reference fields. Aramisauto publishes
  no id prefixes and no ERD; nothing below is inferred from prose.

root_entity: Offer

entities:
- name: Offer
  role: aggregate-root
  key: offerId
  schema: json-schema/aramisauto-catalog-vehicle-single-language-output.schema.json
  write_schema: json-schema/aramisauto-catalog-vehicle-multi-language-input.schema.json
  description: >-
    A commercial vehicle offer — the unit a buyer transacts on and the document
    the search API returns. Carries identity (vin, offerId, vehicleId),
    regulatory classification, pricing, the full technical specification, and its
    variants.
  required_field_count: 81
  identity_fields:
  - vin
  - offerId
  - vehicleId
  commercial_fields:
  - catalogPriceWithOptionsWithTaxes
  - takeoverPremium
  - sellingPriceWithTaxes
  - sellingPriceWithTakeoverWithTaxes
  - discount
  - discountWithTakeover
  - indicativeLoan
  - isMarketplace
  regulatory_fields:
  - euronorm
  - critair
  - frenchFiscalPower
  - frenchGenre
  - belgianFiscalPower
  - belgianOtoto
  - belgianCarpass
  - co2EmissionsNedc
  - co2EmissionsWltp
- name: Variant
  role: child
  key: vehicleId
  parent: Offer
  description: >-
    A physically distinct vehicle sold under the same offer, differing in colour
    and availability. Carries vehicleId, status, manufacturerColor, simpleColor,
    simpleColor2 and photo.
- name: Media
  role: child
  parent: Offer
  description: An ordered media asset (type, url, orientation). `photo` is the single
    primary image.
- name: Equipment
  role: child
  parent: Offer
  description: >-
    Manufacturer equipment, each carrying a label and an equipment category
    ($ref base#/$defs/equipment-category-id: comfort, multimedia, interior,
    exterior, security, other).
- name: SimpleEquipment
  role: child
  parent: Offer
  description: >-
    The searchable, controlled-vocabulary subset of equipment
    ($ref base#/$defs/simple-equipment-id: 7-seats, air-conditioning, gps,
    leather, leather-alcantara, alloy-wheels, reverse-radar, cruise-control,
    sunroof, 4x4, bluetooth, reverse-camera). This is what a buyer filters on;
    Equipment is what the manufacturer shipped.
- name: Option
  role: child
  parent: Offer
  description: A priced factory option (label, priceWithTaxes).
- name: Promotion
  role: child
  parent: Offer
  description: A merchandising promotion applied to the offer (id, label, color).
- name: SearchQuery
  role: request-envelope
  schema: json-schema/aramisauto-catalog-search-request.schema.json
  description: criteria{} + facets[] + order[] + limit/offset + fields[]. Closed to
    unknown members.
- name: SearchResult
  role: response-envelope
  schema: json-schema/aramisauto-catalog-search-response.schema.json
  description: total + limit + offset + vehicles[] (Offer) + facets[] (FacetBucket).
- name: FacetBucket
  role: value-object
  parent: SearchResult
  description: '{ value: {id, label}, count: integer } grouped under one of 20 named
    facets.'
- name: SearchDocument
  role: projection
  schema: json-schema/aramisauto-catalog-vehicle-single-language-searchable-data.schema.json
  description: >-
    The flattened snake_case search-index projection of an Offer. Not a separate
    entity in the domain — the same offer, denormalised for the search engine,
    with id/label pairs split into parallel fields and numeric ranges
    pre-bucketed.
- name: MarketplacePartner
  role: configuration-subject
  key: aramisautoSupplierId
  schema: json-schema/aramisauto-marketplace-collect.schema.json
  description: >-
    A third-party seller whose inventory flows into the Aramisauto marketplace.
    Identified by an Aramisauto-assigned aramisautoSupplierId and bound to an
    aramisautoPickupPointId, a feed url, a CSV format and a purchasingVatRate.
- name: PickupPoint
  role: referenced-entity
  key: aramisautoPickupPointId
  description: >-
    A delivery/collection site referenced by integer id from both the collect and
    map configurations. Its own contract is not published — it is a
    reference-only entity.

