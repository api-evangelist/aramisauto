aid: aramisauto
name: AramisAuto
description: 'Aramisauto is the French retail brand of Aramis Group (Euronext Paris:
  ARAMI, majority-owned by Stellantis), founded in 2001 by Nicolas Chartier and Guillaume
  Paoli. It sells used, 0km and new cars online as a mandataire, reconditions vehicles
  in its own refurbishing centres, runs a trade-in service ("reprise") that pays within
  24 hours, and arranges financing (crédit, LOA, LLD) through Cetelem, Socram, PSA
  Banque, Lizauto and Opteven. Aramisauto operates no public developer programme: there
  is no portal, no OpenAPI and no SDK. What it does publish is machine-readable and
  first-party — ten JSON Schema 2020-12 contracts at schemas.aramis.group covering the
  vehicle catalog (search request/response, the multi-language ingest model, the
  single-language read model served from "the preheated cache for the APIs", and the
  search-index projection) plus the four-stage collect/map/filter/enrich configuration
  contracts third-party marketplace sellers are onboarded with — and an llms.txt at
  the site root. Its API vhost, api.aramisauto.com, answers every anonymous request
  with an HTTP 403 demanding a WSSE (WS-Security UsernameToken) credential.'
