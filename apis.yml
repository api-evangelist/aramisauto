apis:
- name: Aramisauto Vehicle Catalog Contracts
  description: 'Aramis Group publishes the machine-readable contracts behind the Aramisauto
    vehicle catalog as ten JSON Schema 2020-12 documents at https://schemas.aramis.group/
    — a search request envelope (criteria/facets/order/limit/offset/fields), a search
    response envelope (total/limit/offset/vehicles/facets with 20 pre-bucketed facet
    aggregations), a multi-language vehicle ingest model, the single-language vehicle
    read model the site itself describes as "the format used in the preheated cache
    for the APIs", a flattened search-index projection, and a shared base vocabulary
    of 29 controlled term sets and unit-bearing value objects. A companion set of four
    schemas describes the collect → map → filter → enrich pipeline a third-party
    marketplace seller''s inventory feed is configured with. These contracts are the
    only published description of the API surface: no OpenAPI, Swagger, GraphQL SDL or
    AsyncAPI document exists on any Aramisauto or Aramis Group host, and the API vhost
    itself is credential-gated.'
  humanURL: https://schemas.aramis.group/
  baseURL: https://api.aramisauto.com
  tags:
  - Vehicle Data
  - Catalog
  - Search
  - Marketplace
  - JSON-Schema
  tags_raw:
  - Vehicle Data
  - Catalog
  - Search
  - Marketplace
  - JSON Schema
  properties:
