    url: json-schema/_index.yml
  - type: Examples
    url: examples/_index.yml
  - type: Vocabulary
    url: vocabulary/aramisauto-vocabulary.yml
  - type: DataModel
    url: data-model/aramisauto-data-model.yml
  - type: Conventions
    url: conventions/aramisauto-conventions.yml
  - type: Conformance
    url: conformance/aramisauto-conformance.yml
  - type: RateLimits
    url: rate-limits/aramisauto-rate-limits.yml
  - type: SchemaRegistry
    url: https://schemas.aramis.group/
  - type: SourceCode
    url: https://github.com/ARAMISAUTO/schemas.aramis.group
  x-evidence:
    fetched: '2026-08-17'
    schemas:
      url: https://schemas.aramis.group/
      http_status: 200
      documents: 10
      examples: 5
      all_parse: true
      draft: 2020-12
    ownership: >-
      The contracts are served from aramis.group, not aramisauto.com. Aramis Group SA
      is the listed parent that operates the Aramisauto brand in France, the site
      titles itself "Aramis Group Schemas", and the repository behind it
      (github.com/ARAMISAUTO/schemas.aramis.group, CNAME schemas.aramis.group) belongs
      to the GitHub organisation "Aramisauto.com" whose profile blog is
      https://www.aramisauto.com. The field names are Aramisauto-specific —
      aramisautoSupplierId, aramisautoPickupPointId, aramisautoSimpleColor,
      aramisautoCategory, aramisautoBodywork, aramisautoEnergyType,
      aramisautoSellingPriceWithTaxes — so these are this company's contracts, not a
      sibling brand's.
    base_url_probe:
      url: https://api.aramisauto.com/
      http_status: 403
      content_type: application/xml; charset=utf-8
      body: <?xml version="1.0" encoding="utf-8"?><Errors><Error><Message>Missing WSSE
        Username.</Message></Error></Errors>
      headers:
        x-vhostid: api
        x-aramisauto-application: api
      note: >-
        The host is real and is the group's API application vhost, but it is opaque: a
        control path that cannot exist returns the IDENTICAL 403, so the gate sits in
        front of routing and no individual endpoint can be confirmed from anonymous
        probing. baseURL is recorded as the bare host for that reason — no path is
        asserted. No public document ties a named path on this host to the published
        catalog schemas, so that join is deliberately not claimed.
    spec_discovery:
      openapi: none
      note: >-
        Probed /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json,
        /api-docs, /docs, /redoc and /graphql on api.aramisauto.com (blanket 403) and
        on www.aramisauto.com (404, with a control path also 404 — real negatives).
        developer.aramisauto.com, developers.aramisauto.com, docs.aramis.group and
        api.aramis.group do not resolve. /.well-known/agent-card.json and
        /.well-known/agent.json miss on every host. No MCP endpoint is published. The
        GitHub organisation contains no specification.
