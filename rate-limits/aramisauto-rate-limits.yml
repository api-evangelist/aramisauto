limits: []
note: >-
  Aramisauto publishes no API rate limits. There is no developer documentation to
  publish them in, and no rate-limit response header was returned by any probed
  response. The ONLY throttling signal Aramisauto publishes anywhere is a
  `Crawl-delay: 5` directive in robots.txt, which governs crawlers rather than API
  clients and is recorded below as the honest nearest equivalent rather than
  dressed up as an API limit. An agent integrating against this provider has no
  runtime budget signal to read. Honest zero.

